name: Robot large-page source inspection
on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/repository-engine/source-evidence.*'
      - 'agents/repository-engine/runner.mjs'
      - '.github/workflows/source-evidence-test.yml'
  push:
    branches: [main]
    paths:
      - 'agents/repository-engine/source-evidence.*'
      - 'agents/repository-engine/runner.mjs'
      - '.github/workflows/source-evidence-test.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check agents/repository-engine/runner.mjs
      - run: node --test agents/repository-engine/source-evidence.test.mjs
