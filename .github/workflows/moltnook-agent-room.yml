name: Moltnook verified agent room
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent-room.js"
      - "agent-room.css"
      - "agents/**"
      - "activity/iterations.json"
      - ".github/scripts/**"
      - ".github/workflows/moltnook-agent-room.yml"
      - "index.html"

permissions:
  contents: write
  issues: write

concurrency:
  group: moltnook-agent-room
  cancel-in-progress: false

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify frontend JavaScript syntax
        run: node --check agent-room.js
      - name: Verify deterministic agent routing
        run: node --test agents/tests/routing.test.mjs
      - name: Publish source-linked activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-agent-feed.mjs
      - name: Run priority-based agent inspection and human-readable handoffs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/run-agent-iterations.mjs
      - name: Commit updated evidence feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity/feed.json activity/iterations.json
          if git diff --cached --quiet; then
            echo "No new feed changes"
          else
            git commit -m "Refresh verified Moltnook agent activity [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
