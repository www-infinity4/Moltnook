name: Transition stream adapter checks
on:
  pull_request:
    branches:
      - main
      - robot/bounded-context-hash-review-20261013
    paths:
      - 'agents/repository-engine/transition-stream/**'
      - '.github/workflows/transition-stream-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse the Cloudflare worker and adapter
        run: |
          node --check agents/repository-engine/transition-stream/worker.mjs
          node --check agents/repository-engine/transition-stream/bot-adapter.mjs
          node --check agents/repository-engine/runner.mjs
      - name: Verify real Cloudflare bindings without exposing credentials
        run: |
          python3 - <<'PY'
          import json, pathlib, tomllib
          base = pathlib.Path('agents/repository-engine/transition-stream')
          with (base / 'wrangler.toml').open('rb') as fd:
              config = tomllib.load(fd)
          observed = json.loads((base / 'cloudflare-observed-state.json').read_text())
          assert config['name'] == observed['worker']['name']
          assert config['d1_databases'][0]['database_id'] == observed['d1']['databaseId']
          assert config['queues']['producers'][0]['queue'] == observed['queue']['name']
          assert config['queues']['consumers'][0]['dead_letter_queue'] == observed['deadLetterQueue']['name']
          assert config['ratelimits'][0]['name'] == 'INGEST_RATE_LIMITER'
          assert observed['worker']['tokenConfigured'] is False
          assert observed['worker']['workersDevEnabled'] is False
          PY
      - name: Test integrity, retries, budgets and no mint claims
        run: node --test agents/repository-engine/transition-stream/*.test.mjs
