name: Robot Brain isolated Cloudflare Preview canary

on:
  push:
    branches: [main]
    paths:
      - 'agents/repository-engine/brain-isolated-probe.mjs'
      - 'agents/repository-engine/prepare-brain-preview.mjs'
      - 'agents/repository-engine/prepare-brain-preview.test.mjs'
      - 'agents/repository-engine/verify-brain-preview.mjs'
      - 'agents/repository-engine/verify-brain-preview.test.mjs'
      - 'agents/repository-engine/brain-preview-update.mjs'
      - 'agents/repository-engine/brain-preview-update.test.mjs'
      - '.github/workflows/moltnook-brain-isolated-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moltnook-isolated-brain-preview
  cancel-in-progress: false

jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted Moltnook test harness only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canary is read-only and its D1 is separate from production
        run: |
          node --check agents/repository-engine/brain-isolated-probe.mjs
          node --check agents/repository-engine/prepare-brain-preview.mjs
          node --check agents/repository-engine/verify-brain-preview.mjs
          node --check agents/repository-engine/brain-preview-update.mjs
          node --test agents/repository-engine/prepare-brain-preview.test.mjs \
            agents/repository-engine/verify-brain-preview.test.mjs \
            agents/repository-engine/brain-preview-reuse.test.mjs \
            agents/repository-engine/brain-preview-update.test.mjs
      - name: Check out the exact Cloudflare staged Brain source using central GHP
        uses: actions/checkout@v4
        with:
          repository: www-infinity4/QuantaPhi
          ref: bbf3a91dfb4c2059c2a53b7dc8fe16d5923523c2
          path: quantaphi-source
          persist-credentials: false
          token: ${{ secrets.GHP }}
      - name: Pin the candidate source and run actual selector/owner tests
        working-directory: quantaphi-source
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "bbf3a91dfb4c2059c2a53b7dc8fe16d5923523c2" ]]; then
            echo "::error::Staged candidate source revision changed"; exit 1
          fi
          echo "TARGET_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
          node --test \
            test/brain-ticket-selector.test.mjs \
            test/brain-deferred-recovery.test.mjs \
            test/brain-color-core.test.mjs \
            test/brain-clock.test.mjs \
            test/brain-clock-binding-parity.test.mjs \
            test/brain-pink-source-review.test.mjs \
            test/bubbles-runner-dispatch.test.mjs
      - name: Record untouched production version before isolated preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node agents/repository-engine/verify-brain-preview.mjs before
      - name: Prepare ephemeral Preview-only configuration and wrapper
        run: node agents/repository-engine/prepare-brain-preview.mjs
      - name: Dry-run bundle the isolated probe with pinned Pink source
        working-directory: quantaphi-source
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy \
            --config workers/infinity-brain-clock/wrangler.toml \
            --dry-run --outdir /tmp/brain-pink-preview-bundle
          test -s /tmp/brain-pink-preview-bundle/brain-isolated-probe.js

      - name: Update existing isolated Preview source without production traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node agents/repository-engine/brain-preview-update.mjs

      - name: Check real Preview runtime and unchanged production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node agents/repository-engine/verify-brain-preview.mjs after
      - name: Ensure public Preview URLs are disabled after test or failure
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --request POST \
              --data '{"enabled":true,"previews_enabled":false}' \
              "https://api.cloudflare.com/client/v4/accounts/ef25728c096c6ba92cf510caa2058003/workers/scripts/infinity-brain-clock/subdomain" \
              > /tmp/brain-preview-restore.json
            node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          if(JSON.parse(readFileSync('/tmp/brain-preview-restore.json','utf8')).success!==true)
            throw Error('isolated_preview_disable_request_failed');
          console.log('Public Preview URL routing restored to disabled; production Worker traffic unchanged.');
          NODE
          fi
      - name: Archive nonsecret Preview verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-isolated-preview-receipt
          path: repository-receipts/brain-isolated-preview-receipt.json
          if-no-files-found: warn
          retention-days: 14
      - name: State the limited acceptance status
        if: always()
        run: |
          {
            echo "## Isolated Brain preview gate"
            echo "Source candidate: QuantaPhi bbf3a91dfb4c2059c2a53b7dc8fe16d5923523c2"
            echo "Preview tests synthetic, read-only admission and isolated DO/D1 only."
            echo "No user jobs, owner sessions, wallet payouts, repository merges or worker production traffic are invoked."
            echo "A Preview pass does not approve a full production rollout. Preserve the exact stable Worker rollback version."
          } >> "$GITHUB_STEP_SUMMARY"
