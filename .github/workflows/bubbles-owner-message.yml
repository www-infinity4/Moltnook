# Owner requested complete repository-to-live-page acceptance on 2026-10-22.
# Resume the four read-only signed Q&A probes after owner readiness check.
# Owner requested another existing-consent readiness check on 2026-10-22.
# Check owner-page readiness before attempting any native Termux handoff.
name: Bubbles owner-approved message
# Retry after verified production release 39661658507; earlier intake returned403 before creating a ticket.
# Public bounded repair text only. Credentials remain in signed server requests.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bubbles-owner-message.yml', 'scripts/bubbles-signed-chat-acceptance.mjs', 'scripts/bubbles-site-acceptance*', 'scripts/bubbles-organic-computation.mjs', 'scripts/bubbles-memory-pilot.mjs', 'scripts/bubbles-memory-pilot.test.mjs', 'scripts/bubbles-oracle-refinement.mjs', 'scripts/bubbles-oracle-refinement.test.mjs', 'scripts/bubbles-legacy-cart-smoke.mjs', 'scripts/bubbles-legacy-cart-smoke.test.mjs', 'scripts/bubbles-chat-verified-benchmark.mjs', 'scripts/bubbles-chat-verified-benchmark.test.mjs']
  pull_request:
    paths: ['.github/workflows/bubbles-owner-message.yml', 'scripts/bubbles-site-acceptance*', 'agents/repository-engine/phi-skills*', 'agents/repository-engine/skills/**', 'scripts/bubbles-memory-pilot*', 'scripts/bubbles-oracle-refinement*', 'scripts/bubbles-legacy-cart-smoke*', 'scripts/mongoose_cart_inventory.py', 'scripts/test_mongoose_cart_inventory.py', 'agents/repository-engine/verified-fork-registry.json', 'scripts/bubbles-chat-verified-benchmark*']
  workflow_dispatch:
    inputs:
      task:
        description: Fixed owner-approved acceptance task
        type: choice
        default: none
        options: [none, site_acceptance]
permissions:
  contents: read
  id-token: write
jobs:
  build_contracts:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/bubbles-site-acceptance.mjs
      - run: node --check scripts/bubbles-memory-pilot.mjs
      - run: node --check scripts/bubbles-oracle-refinement.mjs
      - run: node --check scripts/bubbles-chat-verified-benchmark.mjs
      - run: node --test scripts/bubbles-chat-verified-benchmark.test.mjs
      - run: node --check scripts/bubbles-legacy-cart-smoke.mjs
      - run: node --test scripts/bubbles-legacy-cart-smoke.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_mongoose_cart_inventory.py' -v
      - run: node --test scripts/bubbles-oracle-refinement.test.mjs
      - run: node --test scripts/bubbles-site-acceptance.test.mjs agents/repository-engine/phi-skills.test.mjs scripts/bubbles-memory-pilot.test.mjs
  site_acceptance:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.task == 'site_acceptance') || (github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Run signed Bubbles site acceptance')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    concurrency:
      group: bubbles-fixed-site-acceptance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source and skill contracts before accessing owner tools
        run: node --test scripts/bubbles-site-acceptance.test.mjs agents/repository-engine/phi-skills.test.mjs
      - name: Bubbles source generation, review, Linux checks and GitHub CLI publish
        env:
          REPOSITORY_WRITE_TOKEN: ${{ secrets.GHP }}
        run: node scripts/bubbles-site-acceptance.mjs
      - name: Preserve actual build outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bubbles-site-acceptance
          path: repository-receipts/bubbles-site-acceptance.json
          if-no-files-found: warn
          retention-days: 14
  message:
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Retry Bubbles owner handoff after verified routing release 20261021') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify saved approval and submit bounded owner repair once
        run: |
          node --input-type=module <<'NODE'
          const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          u.searchParams.set('audience','bubbles-owner-message-bridge');
          const identity=await fetch(u,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},redirect:'error',signal:AbortSignal.timeout(15000)});
          if(!identity.ok)throw Error('signed_owner_identity_unavailable');
          const token=(await identity.json()).value;
          if(typeof token!=='string'||!token)throw Error('signed_owner_identity_missing');
          const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          const consent=await fetch('https://bubbles-cloud-browser.marvaseater.workers.dev/v1/browser/chatgpt/runner',{method:'POST',headers,body:JSON.stringify({operation:'status'}),redirect:'error',signal:AbortSignal.timeout(15000)});
          const proof=await consent.json().catch(()=>({}));
          const expected='chatgpt_runner_'+process.env.GITHUB_RUN_ID;
          console.log('BUBBLES_SIGNED_APPROVAL_CHECK '+JSON.stringify({httpStatus:consent.status,ok:proof.ok===true,jobIdMatches:proof.jobId===expected,consumer:proof.consumer?.state||'unavailable'}));
          if(!consent.ok||proof.ok!==true||proof.jobId!==expected)throw Error('existing_signed_approval_not_verified');
          const body={"repository":"www-infinity4/QuantaPhi","request":"Diagnose and repair QuantaPhi Bubbles' authenticated website-control handoff. Evidence: Moltnook run 39656667627 returned three signed server replies, but the separate Story Writer View Stories request remained queued with consumer=not_observed. Do not infer expired approval, closed app, or missing owner rights from that state. Read AGENTS.md and docs/BUBBLES-GPT-CONNECTION.md, BUBBLES-OWNER-WORK-BRIDGE.md, BUBBLES-CONSUMER-OBSERVATION.md, BUBBLES-OWNER-CONSUMER-QA.md. Trace owner verification, consent partition, consumer mounting/heartbeat, polling/resume, request claim, DOM action adapter, and result acknowledgement. Reproduce the break, implement the smallest repair, and test ready/busy/resume/revoked/expired cases, duplicate delivery, named card taps and same-origin viewer controls. Preserve current authorization, owner sessions, wallets, chat histories and cross-origin boundaries. Do not renew consent or copy credentials. Independently review the exact patch and require target CI before merging. Live acceptance: under an existing authenticated owner page, open Story Writer and tap View Stories once; record ticket/runner IDs, before/after panel state and actual action receipt. Never count a model reply or accepted/queued status as a tap. If no owner consumer can be observed, report the exact blocker and retain pending live acceptance. Keep Android physical validation separate. Report actual commit, tests, merge and deployment receipts, and distinguish prepared/submitted/claimed/completed. In ordinary conversation, use available tools then explain results naturally. Keep ticket IDs and raw tool/code drafts out of speech; test follow-up context and actual page understanding."};
          if(body.repository!=='www-infinity4/QuantaPhi'||body.request.length>1800)throw Error('bounded_owner_request_invalid');
          const result=await fetch('https://infinity-brain-clock.marvaseater.workers.dev/owner/bridge-work',{method:'POST',headers,body:JSON.stringify(body),redirect:'error',signal:AbortSignal.timeout(90000)});
          const receipt=await result.json().catch(()=>({}));
          if(!result.ok||receipt.ok!==true||typeof receipt.ticketId!=='string'||receipt.repository!==body.repository||receipt.completed!==false){
           console.log('BUBBLES_OWNER_WORK_FAILURE '+JSON.stringify({httpStatus:result.status,error:String(receipt.error||'invalid_receipt').replace(/[^a-zA-Z0-9_]/g,'').slice(0,100),ticketConfirmed:false}));
           throw Error('owner_work_intake_not_verified');
          }
          console.log('BUBBLES_OWNER_WORK_RECEIPT '+JSON.stringify({ticketId:receipt.ticketId,repository:receipt.repository,status:receipt.status,deduplicated:receipt.deduplicated===true,execution:{status:receipt.execution?.status||'unverified'},completed:false,productionVerified:false}));
          NODE

  chat_acceptance:
    # Run exactly once for the reviewed synthetic-chat test merge. Never submit
    # another owner work ticket or impersonate a live owner-page consumer.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Run signed Bubbles conversation acceptance 20261021') }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check the public synthetic conversation harness
        run: node --check scripts/bubbles-signed-chat-acceptance.mjs
      - name: Exercise real Bubbles signed chat and read returned responses
        run: node scripts/bubbles-signed-chat-acceptance.mjs
      - name: Preserve bounded public conversation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bubbles-signed-chat-acceptance
          path: repository-receipts/bubbles-signed-chat-acceptance.json
          if-no-files-found: warn
          retention-days: 7

  operator_bridge:
    # Fixed one-use request, authorized by existing consent + GitHub OIDC.
    # Never place phone numbers, wallet credentials, PINs or secrets here.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Repair ChatGPT owner Bubbles delegation 20261021') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Use existing signed owner route for missing ChatGPT operator delegation
        run: |
          node --input-type=module <<'NODE'
          const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          u.searchParams.set('audience','bubbles-owner-message-bridge');
          const id=await fetch(u,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},redirect:'error',signal:AbortSignal.timeout(15000)});
          if(!id.ok)throw Error('signed_identity_unavailable');
          const token=(await id.json()).value;
          if(typeof token!=='string'||!token)throw Error('signed_identity_missing');
          const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          const base='https://bubbles-cloud-browser.marvaseater.workers.dev/v1/browser/chatgpt/runner';
          const approval=await fetch(base,{method:'POST',headers,body:JSON.stringify({operation:'status'}),redirect:'error',signal:AbortSignal.timeout(15000)});
          const proof=await approval.json().catch(()=>({}));
          const match=proof.ok===true&&proof.jobId==='chatgpt_runner_'+process.env.GITHUB_RUN_ID;
          console.log('OWNER_DELEGATION_APPROVAL '+JSON.stringify({verified:approval.ok&&match,consumer:proof.consumer?.state||'not_observed'}));
          if(!approval.ok||!match)throw Error('existing_owner_approval_not_verified');
          const body={repository:'www-infinity4/QuantaPhi',request:'Repair the missing ChatGPT-to-owner-Bubbles and Robot Brain operator bridge. Reuse existing signed Moltnook GitHub OIDC assist/result, Brain bridge-work and verified Unified Wallet owner identity; do not create a new wallet, permanent master PIN or hidden secret. Respect preexisting five-day consent and revocation, server-verify the owner and scoped delegation on EVERY read/write. Implement a narrow, revocable, audited, expiring grant to access canonical owner Bubbles chat messages and submit/status bounded Brain work. Never expose owner history or Brain to public voice/phone callers, other wallets or spoofed caller ID. No Android carrier interception. Test live signed Bubbles messaging, wrong-wallet/revoked/replayed/expired grants, cross-user isolation and independent Brain receipts. Keep GitHub writes, deployment and wallet movement behind existing owner authorization and approval. Require source PR, tests, signed end-to-end confirmation and independent deployment receipt; report queued work as queued, never complete.'};
          if(body.request.length>1800)throw Error('request_too_long');
          const res=await fetch('https://infinity-brain-clock.marvaseater.workers.dev/owner/bridge-work',{method:'POST',headers,body:JSON.stringify(body),redirect:'error',signal:AbortSignal.timeout(90000)});
          const receipt=await res.json().catch(()=>({}));
          const ok=res.ok&&receipt.ok===true&&typeof receipt.ticketId==='string'&&receipt.repository===body.repository&&receipt.completed===false;
          console.log('OWNER_DELEGATION_INTAKE '+JSON.stringify({http:res.status,ticketConfirmed:ok,status:receipt.status||'unavailable',execution:receipt.execution?.status||'unverified',completed:false}));
          if(!ok)throw Error('owner_delegation_intake_unconfirmed');
          NODE

  owner_chat_ready_check:
    # One signed owner-page conversation check, without privileged tool requests.
    # Do not create owner permissions, renew consent or access private history.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Verify live owner Bubbles chat handoff 20261021') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send one harmless synthetic owner-chat ping if the consumer is ready
        run: |
          node --input-type=module <<'NODE'
          const idurl=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          idurl.searchParams.set('audience','bubbles-owner-message-bridge');
          const id=await fetch(idurl,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},redirect:'error',signal:AbortSignal.timeout(15000)});
          if(!id.ok)throw Error('signed_identity_unavailable');
          const token=(await id.json()).value;
          if(!token)throw Error('signed_identity_missing');
          const endpoint='https://bubbles-cloud-browser.marvaseater.workers.dev/v1/browser/chatgpt/runner';
          const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          async function send(body){
            const res=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify(body),redirect:'error',signal:AbortSignal.timeout(15000)});
            const data=await res.json().catch(()=>({}));
            if(!res.ok||data.ok!==true)throw Error('signed_'+body.operation+'_failed_'+res.status+'_'+String(data.error||'unknown').replace(/[^a-z0-9_]/gi,'').slice(0,60));
            if(data.jobId!=='chatgpt_runner_'+process.env.GITHUB_RUN_ID)throw Error('run_identity_mismatch');
            return data;
          }
          const start=await send({operation:'status'});
          console.log('BUBBLES_OWNER_CONSUMER '+JSON.stringify({state:start.consumer?.state||'unavailable',ageSeconds:start.consumer?.ageSeconds??null,existingState:start.state,approved:true}));
          if(start.consumer?.state!=='ready')throw Error('owner_consumer_not_ready_for_live_chat');
          const prompt='Bubbles, this is a signed GPT connection test with your owner. Please answer in one sentence without using tools or creating any jobs. Say you received the message and that the chat is responding.';
          const submitted=await send({operation:'submit',text:prompt});
          console.log('BUBBLES_OWNER_PING '+JSON.stringify({status:submitted.state,accepted:true,completed:false}));
          const deadline=Date.now()+90000;
          let finalState=submitted.state;
          while(Date.now()<deadline){
            await new Promise(resolve=>setTimeout(resolve,7500));
            const result=await send({operation:'status'});
            finalState=result.state;
            if(['complete','blocked'].includes(finalState)){
              console.log('BUBBLES_OWNER_CHAT_RESULT '+JSON.stringify({state:finalState,consumer:result.consumer?.state||'unavailable',failureCode:result.failureCode||null,privateReplyNotExposed:true,phoneAccess:false,brainWrite:false}));
              if(finalState!=='complete')throw Error('owner_chat_not_completed');
              process.exit(0);
            }
          }
          throw Error('owner_chat_no_verified_reply_'+finalState);
          NODE

  browser_acceptance:
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Run signed Bubbles browser acceptance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify real browser click and explain its same-run receipt
        run: |
          node --input-type=module <<'NODE'
          const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          u.searchParams.set('audience','bubbles-owner-message-bridge');
          const identity=await fetch(u,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},redirect:'error',signal:AbortSignal.timeout(15000)});
          if(!identity.ok)throw Error('signed_identity_unavailable');
          const token=(await identity.json()).value;
          if(!token)throw Error('signed_identity_missing');
          const endpoint='https://bubbles-cloud-browser.marvaseater.workers.dev/v1/browser/chatgpt/runner';
          async function send(body){
            const r=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body),redirect:'error',signal:AbortSignal.timeout(120000)});
            const j=await r.json();
            if(!r.ok||j.ok!==true)throw Error('signed_request_failed_'+r.status+'_'+String(j.error||'unknown').replace(/[^a-z0-9_]/gi,'').slice(0,80));
            return j;
          }
          const check=await send({operation:'browser_check'});
          const result=check.result,receipt=result?.receipt;
          console.log('BUBBLES_BROWSER_CHECK '+JSON.stringify({state:check.state,result}));
          if(check.state!=='complete'||result?.ok!==true||receipt?.tool!=='browser.click_check'||receipt.status!=='complete'||!['clickObserved','beforeObserved','afterObserved','sessionClosed'].every(k=>receipt[k]===true)||result.before!=='Waiting for browser check.'||result.after!=='Bubbles clicked this control.')throw Error('browser_click_not_verified');
          // Public Bubbles entry must be a real CDP click with an observed
          // same-page state change, not a model-generated claim or private page.
          if(!['publicPageReadVerified','publicChatClickDispatched','publicChatPageChangeObserved'].every(k=>receipt[k]===true)||
             result.publicPage?.readVerified!==true||result.publicPage?.entryClick?.status!=='page_change_observed'||
             result.publicPage?.title?.includes('Bubbles AI')!==true||receipt.ownerPageVerified!==false)
            throw Error('public_bubbles_chat_entry_not_verified');
          const replay=await send({operation:'browser_check'});
          if(JSON.stringify(replay.result)!==JSON.stringify(result))throw Error('browser_replay_changed');
          const chat=await send({operation:'assist',turn:0,text:'What did your cloud browser just click? Use the actual browser receipt from this run. Explain what changed and whether cleanup was confirmed in two sentences.'});
          console.log('BUBBLES_BROWSER_CHAT '+JSON.stringify(chat));
          const readback=await send({operation:'result',turn:0});
          console.log('BUBBLES_BROWSER_CHAT_READBACK '+JSON.stringify(readback));
          if(readback.state!=='complete')throw Error('browser_chat_not_complete');
          const answer=String(readback.result?.output||'').replace(/\s+/g,' ');
          if(!/Run browser check/i.test(answer)||!/(?:cleanup|closed)/i.test(answer)||/(?:cleanup.{0,35}(?:not|wasn.t|unconfirmed)|(?:not|wasn.t).{0,20}confirmed)/i.test(answer))throw Error('browser_receipt_explanation_incorrect');
          NODE


# Reviewed owner-requested Linux site acceptance: 2026-10-22.

# Retest after deployed empty-model-response recovery.

# Live source drafting and owner Pages reader deployed; rerun full build.

  organic_computation:
    # Bubbles gateway only trusts the already approved owner-message workflow.
    # This job reuses that signed identity, never signs in as a visitor or bypasses revocation.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Run signed Bubbles organic computation repository creation 20261022 trusted-owner') }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fixed signed research build contracts
        run: |
          node --check scripts/bubbles-organic-computation.mjs
          node --test scripts/bubbles-organic-computation.test.mjs
      - name: Ask signed Bubbles and create the fixed research repository
        env:
          REPOSITORY_WRITE_TOKEN: ${{ secrets.GHP }}
        run: node scripts/bubbles-organic-computation.mjs
      - name: Upload exact repository creation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bubbles-organic-computation-trusted-owner
          path: repository-receipts/organic-computation.json
          if-no-files-found: warn
          retention-days: 14

  memory_sector_pilot:
    # Same pre-existing OIDC owner workflow as Bubbles; no new permanent permission.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Run signed Bubbles memory sector pilot 20261022 trusted-owner') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test privacy, routing and Oracle source grading
        run: |
          node --check scripts/bubbles-memory-pilot.mjs
          node --test scripts/bubbles-memory-pilot.test.mjs agents/repository-engine/phi-skills.test.mjs
      - name: Use signed Bubbles and create private schema-only memory repositories
        env:
          REPOSITORY_WRITE_TOKEN: ${{ secrets.GHP }}
        run: node scripts/bubbles-memory-pilot.mjs
      - name: Preserve verified owner-run receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bubbles-memory-sector-private-pilot
          path: repository-receipts/bubbles-memory-pilot.json
          if-no-files-found: warn
          retention-days: 14

  oracle_grade_refinement:
    # Source-only scoring for synthetic Bubbles UI code; same signed owner identity.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Run signed Bubbles Oracle grading refinement 20261022 trusted-owner') }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify feedback grading controls
        run: |
          node --check scripts/bubbles-oracle-refinement.mjs
          node --test scripts/bubbles-oracle-refinement.test.mjs
      - name: Ask signed Bubbles twice, grade and save private feedback
        env:
          REPOSITORY_WRITE_TOKEN: ${{ secrets.GHP }}
        run: node scripts/bubbles-oracle-refinement.mjs
      - name: Preserve exact grading outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bubbles-oracle-refinement
          path: repository-receipts/bubbles-oracle-refinement.json
          if-no-files-found: warn
          retention-days: 14

  legacy_cart_smoke:
    # Read-only synthetic Bubbles conversation using existing short-lived five-day owner approval.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Run signed Bubbles legacy cart source awareness 20261022 trusted-owner') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static Python cart metadata inventory and skill routing
        run: |
          python3 -m unittest discover -s scripts -p 'test_mongoose_cart_inventory.py' -v
          node --test scripts/bubbles-legacy-cart-smoke.test.mjs agents/repository-engine/phi-skills.test.mjs
      - name: Ask signed Bubbles to distinguish mongoose carts from ESP32
        run: node scripts/bubbles-legacy-cart-smoke.mjs
      - name: Preserve synthetic response and graded receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bubbles-legacy-cart-smoke
          path: repository-receipts/bubbles-legacy-cart-smoke.json
          if-no-files-found: warn
          retention-days: 14

  chat_benchmark_20261022:
    # Non-sensitive signed test; never grants a new owner capability or bypasses expiry.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Run signed Bubbles chat benchmark 20261022 trusted-owner') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
