name: Infinity live mobile browser observer
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'agents/repository-engine/live-browser.mjs'
      - 'agents/repository-engine/live-browser-smoke.mjs'
      - '.github/workflows/infinity-live-browser.yml'
      - 'scripts/automated-repair-handler*'
permissions:
  contents: read
concurrency:
  group: infinity-public-browser-observer
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright browser
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check public pages, in-page destinations and mobile rendering
        run: node agents/repository-engine/live-browser-smoke.mjs
      - name: Preserve public HTML/browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infinity-live-browser-observations
          path: repository-receipts/public-live-browser*
          retention-days: 7
          if-no-files-found: warn

  analyze-failure:
    needs: observe
    if: ${{ always() && needs.observe.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test failure bridge and selector lookup
        run: node --test scripts/automated-repair-handler.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: infinity-live-browser-observations
          path: artifacts
      - name: Locate pinned source and persist deduplicated repair tickets
        env:
          REPAIR_INTAKE_TOKEN: ${{ secrets.GHP }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/automated-repair-handler.mjs artifacts
      - name: Preserve actual dispatch receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infinity-browser-repair-tickets
          path: repository-receipts/browser-repair-tickets.json
          if-no-files-found: warn
