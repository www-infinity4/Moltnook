name: Infinity live mobile browser observer
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'agents/repository-engine/live-browser.mjs'
      - 'agents/repository-engine/live-browser-smoke.mjs'
      - '.github/workflows/infinity-live-browser.yml'
permissions:
  contents: read
concurrency:
  group: infinity-public-browser-observer
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright browser
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check public pages, in-page destinations and mobile rendering
        run: node agents/repository-engine/live-browser-smoke.mjs
      - name: Preserve public HTML/browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infinity-live-browser-observations
          path: repository-receipts/public-live-browser*
          retention-days: 7
          if-no-files-found: warn
