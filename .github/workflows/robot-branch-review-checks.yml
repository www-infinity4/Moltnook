name: Robot Brain staged source checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/repository-engine/**'
      - '.github/workflows/**'
      - 'styles.css'
      - 'agent-room.css'
      - 'agent-iteration-card.css'
      - 'index.html'
      - 'agents/model-job.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-robot-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse clone, ticket and publication scripts
        run: |
          node --check agents/repository-engine/publish-reviewed.mjs
          node --check agents/repository-engine/python-toolbox.mjs
          node --check agents/repository-engine/auto-ticket-sweep.mjs
      - name: Exercise branch-only publishing, pinned Python tools and real ticket dedup
        run: |
          node --test agents/repository-engine/publish-reviewed.test.mjs
          node --test agents/repository-engine/python-toolbox.test.mjs
          node --test agents/repository-engine/auto-ticket-sweep.test.mjs
          node --test agents/repository-engine/oracle-review-gate.test.mjs agents/repository-engine/oracle-owner-inventory.test.mjs
          node --check agents/repository-engine/context-windows.mjs
          node --check agents/repository-engine/patch.mjs
          node --test agents/repository-engine/patch.test.mjs
          node --test agents/repository-engine/pink-review-race.test.mjs
          node --check agents/repository-engine/runner.mjs
          node --check agents/repository-engine/source-verify.mjs
          node --test agents/repository-engine/source-verify.test.mjs
          node --check agents/repository-engine/credential-bridge.mjs
          node --test agents/repository-engine/credential-bridge.test.mjs agents/repository-engine/runner-oidc-bridge.test.mjs
          node --check agents/repository-engine/brain-owner-release.mjs
          node --test agents/repository-engine/brain-owner-release.test.mjs
          node --check agents/repository-engine/brain-cloudflare-stage.mjs
          node --test agents/repository-engine/brain-cloudflare-stage.test.mjs
          node --check agents/repository-engine/prepare-brain-preview.mjs
          node --check agents/repository-engine/verify-brain-preview.mjs
          node --test agents/repository-engine/prepare-brain-preview.test.mjs agents/repository-engine/verify-brain-preview.test.mjs agents/repository-engine/brain-preview-reuse.test.mjs
          node --check agents/repository-engine/brain-preview-reuse.mjs
          node --check agents/repository-engine/dependency-context.mjs
          node --check agents/repository-engine/evidence-replan.mjs
          node --test agents/repository-engine/dependency-context.test.mjs agents/repository-engine/evidence-replan.test.mjs
          node --check agents/repository-engine/color-core.mjs
          node --test agents/repository-engine/color-core.test.mjs
          node --test agents/tests/color-child-bots.test.mjs
          node --check agents/repository-engine/green-build-recovery.mjs
          node --test agents/repository-engine/green-build-recovery.test.mjs
          node --test agents/repository-engine/context-windows.test.mjs agents/repository-engine/runner-window-replan.test.mjs
          node --test agents/repository-engine/oracle-style-contract.test.mjs
      - name: Assert Oracle surface and functional JavaScript syntax
        run: |
          node --check agent-room.js
          node --check agent-iteration-card.js
          node --test agents/tests/routing.test.mjs agents/tests/color-child-bots.test.mjs
          node -e "const fs=require('fs'); const s=fs.readFileSync('agent-room.css','utf8'); if(!s.includes('#f7f4f0')||!s.includes('#b83b32')||!s.includes('min-height:44px'))process.exit(1)"
