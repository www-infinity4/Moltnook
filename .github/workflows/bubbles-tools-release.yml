name: Release verified Bubbles tools
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bubbles-tools-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bubbles-tools-verified-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: www-infinity4/QuantaPhi
          ref: a3c020fb83df154048d1e1206a61a6d8989d7cca
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact source and regressions
        run: |
          test "$(git rev-parse HEAD)" = "a3c020fb83df154048d1e1206a61a6d8989d7cca"
          node --check workers/bubbles-tools/worker.mjs
          node --test test/bubbles-read-agent.test.mjs test/bubbles-tools.test.mjs test/bubbles-mcp.test.mjs test/bubbles-live-lookup.test.mjs test/bubbles-natural-tool-sweep.test.mjs test/bubbles-search-completion.test.mjs test/bubbles-source-read-ui.test.mjs test/bubbles-live-tool-acceptance.test.mjs test/bubbles-orb-semantic.test.mjs test/bubbles-owner-immediate-dispatch.test.cjs
      - name: Install reproducible Wrangler uploader with bounded npm retries
        run: |
          set -euo pipefail
          npm config set fetch-timeout 30000
          npm config set fetch-retries 2
          for attempt in 1 2; do
            if timeout 105s npm install --no-save --no-audit --no-fund --prefer-offline wrangler@4.45.0; then
              test -x node_modules/.bin/wrangler
              node_modules/.bin/wrangler --version
              break
            fi
            if [ "$attempt" = 2 ]; then
              echo 'Wrangler installation unavailable; no Cloudflare deployment was attempted.'
              exit 1
            fi
            echo 'Retrying pinned Wrangler installation before any Cloudflare mutation.'
          done
      - name: Stage, verify bindings, promote, and require live page/weather receipts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ef25728c096c6ba92cf510caa2058003
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {mkdirSync,writeFileSync,readFileSync} from 'node:fs';
          const pin='a3c020fb83df154048d1e1206a61a6d8989d7cca',token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw Error('existing_deploy_credential_missing');
          const root='https://api.cloudflare.com/client/v4/accounts/ef25728c096c6ba92cf510caa2058003/workers/scripts/bubbles-tools';
          async function api(path,body){
            const r=await fetch(root+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),redirect:'error',signal:AbortSignal.timeout(15000)});
            if(!r.ok)throw Error('cloudflare_http_'+r.status);
            const j=await r.json();if(!j.success)throw Error('cloudflare_request_failed');return j.result;
          }
          const active=r=>(r.deployments||r)[0];
          const baseline=active(await api('/deployments'));
          if(baseline?.versions?.length!==1||baseline.versions[0].percentage!==100)throw Error('single_production_version_required');
          const previous=baseline.versions[0].version_id,current=await api('/versions/'+previous);
          const canonical=x=>Array.isArray(x)?x.map(canonical):x&&typeof x==='object'?Object.fromEntries(Object.entries(x).sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>[k,canonical(v)])):x;
          function bindings(v){
            const b=v.resources?.bindings;if(!Array.isArray(b))throw Error('bindings_missing');
            for(const name of ['AI','ORACLE','NEWS','BRAIN','SEARCH'])if(!b.some(x=>x.name===name))throw Error('required_binding_missing_'+name);
            return JSON.stringify(canonical([...b].sort((a,b)=>a.name.localeCompare(b.name))));
          }
          const beforeBindings=bindings(current);
          console.log('Existing bindings verified; staging reviewed source without changing traffic.');
          let config=readFileSync('workers/bubbles-tools/wrangler.toml','utf8');
          if(!current.resources.bindings.some(b=>b.name==='BROWSER'))
            config=config.replace(/\n\[browser\]\nbinding = "BROWSER"\n?/,'\n');
          config=config.replace('main = "worker.mjs"','main = "'+process.cwd()+'/workers/bubbles-tools/worker.mjs"');
          writeFileSync('/tmp/bubbles-tools-release.toml',config,{mode:0o600});
          const output=execFileSync('./node_modules/.bin/wrangler',['versions','upload','--config','/tmp/bubbles-tools-release.toml','--message','Reviewed Bubbles conversation quality '+pin],{encoding:'utf8',env:process.env,timeout:150000,maxBuffer:4000000});
          const candidate=output.match(/Worker Version ID: ([a-f0-9-]{36})/)?.[1];
          if(!candidate)throw Error('candidate_version_missing');
          const next=await api('/versions/'+candidate);
          if(!String(next.annotations?.['workers/message']||'').includes(pin))throw Error('candidate_provenance_mismatch');
          if(bindings(next)!==beforeBindings)throw Error('existing_binding_identity_changed');
          if(active(await api('/deployments')).id!==baseline.id)throw Error('production_changed_during_staging');
          let promoted=false;
          try{
            await api('/deployments',{strategy:'percentage',versions:[{version_id:candidate,percentage:100}],annotations:{'workers/message':'Verified Bubbles tools '+pin}});
            promoted=true;
            const deployed=active(await api('/deployments'));
            if(deployed.versions?.length!==1||deployed.versions[0].version_id!==candidate||deployed.versions[0].percentage!==100)throw Error('production_readback_failed');
            // Cloudflare edge propagation may lag a freshly verified deployment.
            // Probe boundedly and retain the original hard fail/automatic rollback.
            let revision='unavailable';
            for(let attempt=0;attempt<7;attempt++){
              const health=await fetch('https://bubbles-tools.marvaseater.workers.dev/health?bubbles_release_check='+attempt,{
                headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)}).then(r=>r.json()).catch(()=>({}));
              revision=String(health.revision||'unavailable').slice(0,100);
              if(revision==='20261022-read-agent-v1')break;
              if(attempt<6)await new Promise(resolve=>setTimeout(resolve,1500));
            }
            console.log('BUBBLES_TOOLS_HEALTH_MARKER '+revision);
            // Public fixed-fixture diagnostic: no owner credentials or private history.
            const pageProbe=await fetch('https://bubbles-tools.marvaseater.workers.dev/v1/assist',{
              method:'POST',redirect:'manual',headers:{Origin:'https://quantaphi.org','Content-Type':'application/json'},
              body:JSON.stringify({request:'Inspect https://quantaphi.org/bubbles.html and explain what the Bubbles page offers.'}),
              signal:AbortSignal.timeout(20000)});
            const probe=await pageProbe.json().catch(()=>({}));
            console.log('BUBBLES_HTML_LIVE_DIAGNOSTIC '+JSON.stringify({
              http:pageProbe.status,tool:probe.receipt?.tool||'missing',status:probe.receipt?.status||'missing',
              reason:probe.receipt?.reason||'none',url:probe.sourceUrl||'none',
              outputPreview:String(probe.output||'').slice(0,160)}));
            if(revision!=='20261022-read-agent-v1')throw Error('production_source_marker_missing');
            const live=execFileSync('node',['scripts/verify-bubbles-live-tools.mjs'],{encoding:'utf8',timeout:60000,maxBuffer:1000000});
            console.log(live);
            const receipt={status:'deployed_and_live_verified',worker:'bubbles-tools',source:pin,version:candidate,previous,bindingsPreserved:true,publicPageAndThreeTownRouteVerified:true};
            mkdirSync('repository-receipts',{recursive:true});writeFileSync('repository-receipts/bubbles-tools-release.json',JSON.stringify(receipt,null,2));
            console.log(JSON.stringify(receipt));
          }catch(error){
            if(promoted){
              await api('/deployments',{strategy:'percentage',versions:[{version_id:previous,percentage:100}],annotations:{'workers/message':'Automatic rollback: live Bubbles acceptance failed'}});
              if(active(await api('/deployments')).versions?.[0]?.version_id!==previous)throw Error('rollback_readback_failed');
              console.log('Live acceptance failed; previous production version restored.');
            }
            throw error;
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bubbles-tools-release-receipt
          path: repository-receipts/bubbles-tools-release.json
          if-no-files-found: warn
