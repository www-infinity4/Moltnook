name: Bubbles extended reasoning QA source contracts
# Unprivileged unit checks on source changes only. Live signed QA uses the one
# trusted, identity-pinned bubbles-owner-message.yml workflow.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/bubbles-chat-verified-benchmark.mjs'
      - 'scripts/bubbles-chat-verified-benchmark.test.mjs'
      - '.github/workflows/bubbles-extended-chat-acceptance.yml'
  pull_request:
    paths:
      - 'scripts/bubbles-chat-verified-benchmark.mjs'
      - 'scripts/bubbles-chat-verified-benchmark.test.mjs'
      - '.github/workflows/bubbles-extended-chat-acceptance.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/bubbles-chat-verified-benchmark.mjs
      - run: node --test scripts/bubbles-chat-verified-benchmark.test.mjs
