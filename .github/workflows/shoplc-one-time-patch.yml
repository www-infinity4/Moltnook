name: Owner-approved one-time ShopLC viewer patch
on:
  push:
    branches: ['ops/shoplc-viewer-20261011']
    paths: ['.github/workflows/shoplc-one-time-patch.yml']
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/shoplc-embed.test.cjs
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.REPAIR_BOT_APP_ID }}
          private-key: ${{ secrets.REPAIR_BOT_APP_PRIVATE_KEY }}
          owner: www-infinity4
          repositories: QuantaPhi
          permission-contents: write
          permission-pull-requests: write
      - run: node ops/shoplc-apply.mjs
        env:
          REPAIR_APP_TOKEN: ${{ steps.app.outputs.token }}
