name: Oracle style promotion via shared target CI
# Legacy independent GPT review removed. The scheduled repository engine already
# checks routine owner robot PRs every five minutes with the shared merge gate.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agents/repository-engine/oracle-review-promoter.mjs'
      - 'agents/repository-engine/oracle-review-promoter.test.mjs'
      - '.github/workflows/oracle-reviewed-pr-promotion.yml'
permissions:
  contents: read
concurrency:
  group: infinity-oracle-compatibility-promotion
  cancel-in-progress: false
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact-head CI and branch-scope promotion policy
        run: |
          node --check agents/repository-engine/oracle-review-promoter.mjs
          node --test agents/repository-engine/oracle-review-promoter.test.mjs agents/repository-engine/auto-promote-reviewed.test.mjs
      - name: Delegate to shared, owner-scoped GitHub merger
        env:
          REPOSITORY_WRITE_TOKEN: ${{ secrets.GHP }}
        run: node agents/repository-engine/oracle-review-promoter.mjs
      - name: Preserve GitHub merge and blocker receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-shared-ci-promotion
          path: repository-receipts/oracle-promotion-review.json
          retention-days: 14
