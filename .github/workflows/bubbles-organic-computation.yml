name: Bubbles Organic Computation Repository
on:
  pull_request:
    paths:
      - 'scripts/bubbles-organic-computation.mjs'
      - 'scripts/bubbles-organic-computation.test.mjs'
      - '.github/workflows/bubbles-organic-computation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/bubbles-organic-computation.mjs'
      - 'scripts/bubbles-organic-computation.test.mjs'
      - '.github/workflows/bubbles-organic-computation.yml'
permissions:
  contents: read
jobs:
  source_checks:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/bubbles-organic-computation.mjs
      - run: node --test scripts/bubbles-organic-computation.test.mjs
  create_repository:
    # User-authorized fixed repo job; never triggered by PRs, forks or arbitrary task payloads.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Run signed Bubbles organic computation repository creation 20261022') }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test scripts/bubbles-organic-computation.test.mjs
      - name: Research with signed Bubbles and create the fixed GitHub repository
        env:
          REPOSITORY_WRITE_TOKEN: ${{ secrets.GHP }}
        run: node scripts/bubbles-organic-computation.mjs
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bubbles-organic-computation-receipt
          path: repository-receipts/organic-computation.json
          if-no-files-found: warn
          retention-days: 14
