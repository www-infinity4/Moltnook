name: Bubbles Organic Computation Repository
on:
  pull_request:
    paths:
      - 'scripts/bubbles-organic-computation.mjs'
      - 'scripts/bubbles-organic-computation.test.mjs'
      - '.github/workflows/bubbles-organic-computation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/bubbles-organic-computation.mjs'
      - 'scripts/bubbles-organic-computation.test.mjs'
      - '.github/workflows/bubbles-organic-computation.yml'
permissions:
  contents: read
jobs:
  source_checks:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/bubbles-organic-computation.mjs
      - run: node --test scripts/bubbles-organic-computation.test.mjs
