name: Verify Bubbles owner bridge through existing Cloudflare credential
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bubbles-owner-bridge-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check production bindings and submit one harmless bridge probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw Error('existing_cloudflare_credential_missing');
          const root='https://api.cloudflare.com/client/v4/accounts/ef25728c096c6ba92cf510caa2058003';
          async function api(path,body){
            const r=await fetch(root+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(15000)});
            if(!r.ok)throw Error('cloudflare_http_'+r.status);
            const j=await r.json();if(!j.success)throw Error('cloudflare_request_rejected');return j.result;
          }
          const deployments=await api('/workers/scripts/bubbles-cloud-browser/deployments');
          const active=(deployments.deployments||deployments)[0];
          if(!active?.versions?.length)throw Error('browser_deployment_missing');
          const version=await api('/workers/scripts/bubbles-cloud-browser/versions/'+active.versions[0].version_id);
          const bindings=version.resources?.bindings||[];
          for(const name of ['BRAIN','BROWSER','CONSENT','BRIDGE_DB'])if(!bindings.some(b=>b.name===name))throw Error('missing_binding_'+name);
          console.log('Cloudflare API credential accepted; browser deployment and required bindings verified.');
          const db='/d1/database/4aa6a463-02c6-48c3-854f-a87c0ca5f41c/query';
          const id='chatgpt_probe_'+process.env.GITHUB_RUN_ID;
          const now=Date.now();
          await api(db,{sql:"INSERT OR IGNORE INTO bubbles_chatgpt_bridge(id,action,payload,status,created_ms,updated_ms,expires_ms) VALUES(?,'message',?,'queued',?,?,?)",params:[id,JSON.stringify({text:'Connection check only: reply that the owner-approved Bubbles bridge received this message. Do not run jobs, change files, access personal information, or change wallets.'}),now,now,now+240000]});
          console.log('Harmless probe queued. Execution still requires existing owner verification and five-day consent.');
          for(let i=0;i<12;i++){
            const rows=await api(db,{sql:'SELECT status FROM bubbles_chatgpt_bridge WHERE id=?',params:[id]});
            const status=rows?.[0]?.results?.[0]?.status;
            console.log('Bridge probe state: '+String(status||'missing'));
            if(status==='complete')break;
            if(status==='blocked')throw Error('owner_bridge_probe_blocked');
            if(i===11)throw Error('owner_bridge_not_processed_within_88_seconds');
            await new Promise(resolve=>setTimeout(resolve,8000));
          }
          NODE
