name: Release verified Bubbles server connection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bubbles-approval-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bubbles-cloud-browser-verified-stage
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Promote exact staged version with matching bindings and verify readback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;if(!token)throw Error('existing_credential_missing');
          const root='https://api.cloudflare.com/client/v4/accounts/ef25728c096c6ba92cf510caa2058003/workers/scripts/bubbles-cloud-browser';
          const candidate='fd62f6bc-143a-4004-b379-092fa70ba69b';
          const pin='4417ed10668f81ed107d9307f74919f2b5214abe';
          async function api(path,body){
           const r=await fetch(root+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(15000)});
           if(!r.ok)throw Error('cloudflare_http_'+r.status);
           const j=await r.json();if(!j.success)throw Error('cloudflare_unsuccessful');return j.result;
          }
          const active=r=>(r.deployments||r)[0];
          const baseline=active(await api('/deployments'));
          if(baseline?.versions?.length!==1||baseline.versions[0].percentage!==100)throw Error('baseline_not_single_full_version');
          const old=baseline.versions[0].version_id;
          const current=await api('/versions/'+old),next=await api('/versions/'+candidate);
          if(!String(next.annotations?.['workers/message']||'').includes(pin))throw Error('candidate_source_mismatch');
          function bindings(v){
           const b=v.resources?.bindings;if(!Array.isArray(b))throw Error('bindings_missing');
           for(const n of ['BRAIN','BROWSER','CONSENT','BRIDGE_DB'])if(!b.some(x=>x.name===n))throw Error('required_binding_missing');
           const tools=b.find(x=>x.name==='TOOLS');
           if(tools&&(tools.type!=='service'||tools.service!=='bubbles-tools'||(tools.environment&&tools.environment!=='production')||tools.entrypoint))throw Error('unexpected_tools_binding');
           return JSON.stringify(b.filter(x=>x.name!=='TOOLS').map(x=>Object.fromEntries(Object.entries(x).sort(([a],[b])=>a.localeCompare(b)))).sort((a,b)=>a.name.localeCompare(b.name)));
          }
          if(!next.resources?.bindings?.some(x=>x.name==='TOOLS'&&x.type==='service'&&x.service==='bubbles-tools'))throw Error('tools_binding_missing');
          if(bindings(current)!==bindings(next))throw Error('binding_identity_changed');
          const check=active(await api('/deployments'));if(check.id!==baseline.id)throw Error('production_changed_during_preflight');
          if(old!==candidate)await api('/deployments',{strategy:'percentage',versions:[{version_id:candidate,percentage:100}],annotations:{'workers/message':'Owner-authorized Bubbles signed server conversation; source '+pin}});
          const live=active(await api('/deployments'));
          if(live.versions?.length!==1||live.versions[0].version_id!==candidate||live.versions[0].percentage!==100)throw Error('release_readback_failed');
          console.log(JSON.stringify({status:'deployed',worker:'bubbles-cloud-browser',version:candidate,source:pin,bindingsPreserved:true,ownerSessionVerified:false,queueAccessVerified:false}));
          NODE
