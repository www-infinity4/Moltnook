name: Robot workflow evidence security gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/repository-engine/source-evidence.mjs'
      - 'agents/repository-engine/scoped-capabilities.mjs'
      - 'agents/repository-engine/evidence-replan.mjs'
      - 'agents/repository-engine/feature-manifest.mjs'
      - 'agents/repository-engine/feature-manifest.test.mjs'
      - 'agents/repository-engine/evidence-replan.test.mjs'
      - 'agents/repository-engine/scoped-capabilities.test.mjs'
      - 'agents/repository-engine/source-links.mjs'
      - 'agents/repository-engine/source-links.test.mjs'
      - 'agents/repository-engine/workflow-evidence.mjs'
      - 'agents/repository-engine/runner.mjs'
      - 'agents/repository-engine/live-browser.mjs'
      - 'agents/repository-engine/live-browser.test.mjs'
      - 'agents/repository-engine/browser-observation-gate.mjs'
      - 'agents/repository-engine/browser-observation-gate.test.mjs'
      - 'agents/repository-engine/live-browser-smoke.mjs'
      - 'scripts/automated-repair-handler.mjs'
      - 'scripts/automated-repair-handler.test.mjs'
      - 'scripts/repair-draft-dispatch.mjs'
      - 'scripts/repair-draft-dispatch.test.mjs'
      - '.github/workflows/browser-repair-draft-dispatch.yml'
      - '.github/workflows/infinity-live-browser.yml'
      - 'agents/repository-engine/*evidence.test.mjs'
      - '.github/workflows/robot-workflow-evidence-gate.yml'
  push:
    branches: [main]
    paths:
      - 'agents/repository-engine/source-evidence.mjs'
      - 'agents/repository-engine/workflow-evidence.mjs'
      - 'agents/repository-engine/runner.mjs'
      - 'agents/repository-engine/live-browser.mjs'
      - 'agents/repository-engine/live-browser.test.mjs'
      - 'agents/repository-engine/*evidence.test.mjs'
      - '.github/workflows/robot-workflow-evidence-gate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check agents/repository-engine/runner.mjs
      - run: node --check agents/repository-engine/source-links.mjs
      - run: node --check agents/repository-engine/scoped-capabilities.mjs
      - run: node --check agents/repository-engine/evidence-replan.mjs
      - run: node --check agents/repository-engine/feature-manifest.mjs
      - run: node --check agents/repository-engine/live-browser.mjs
      - run: node --check agents/repository-engine/browser-observation-gate.mjs
      - run: node --check agents/repository-engine/live-browser-smoke.mjs
      - run: node --check scripts/automated-repair-handler.mjs
      - run: node --test scripts/automated-repair-handler.test.mjs
      - run: node --check scripts/repair-draft-dispatch.mjs
      - run: node --test scripts/repair-draft-dispatch.test.mjs
      - run: node --test agents/repository-engine/source-evidence.test.mjs agents/repository-engine/workflow-evidence.test.mjs agents/repository-engine/source-links.test.mjs agents/repository-engine/scoped-capabilities.test.mjs agents/repository-engine/evidence-replan.test.mjs agents/repository-engine/feature-manifest.test.mjs agents/repository-engine/live-browser.test.mjs agents/repository-engine/browser-observation-gate.test.mjs agents/repository-engine/patch.test.mjs
