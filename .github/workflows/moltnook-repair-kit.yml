name: Moltnook automatic repository repair kit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/moltnook-repair-kit.yml"
      - "agents/repair-kit/**"
  schedule:
    - cron: "46 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moltnook-repair-kit
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Greenbeans checks repository for uniquely repairable broken local asset links
        run: |
          node --check agents/repair-kit/run-repair.mjs
          node agents/repair-kit/run-repair.mjs --fix
      - name: Pink Panther independently validates the patched output
        run: |
          node --check agent-room.js
          node --check agent-iteration-card.js
          node --test agents/tests/routing.test.mjs
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('activity/repair-report.json'));if(!Array.isArray(x.repairCandidates)||!Array.isArray(x.unresolved))process.exit(1);console.log(x.applied,'safe local repairs recorded')"
      - name: Commit repair receipts and safe source changes
        run: |
          git config user.name "infinity-color-agents[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity/repair-report.json '*.html' || true
          if git diff --cached --quiet; then
            echo "No changed files"
          else
            git commit -m "Greenbeans repair and Pink Panther verified receipts [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
