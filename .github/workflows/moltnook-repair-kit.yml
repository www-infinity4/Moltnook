name: Moltnook automatic repository repair kit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/moltnook-repair-kit.yml"
      - "agents/repair-kit/**"
  schedule:
    - cron: "46 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moltnook-repair-kit
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect and apply uniquely matched local repairs
        run: |
          node --check agents/repair-kit/run-repair.mjs
          node agents/repair-kit/run-repair.mjs --fix
      - name: Independently validate patched output
        run: |
          node --check agent-room.js
          node --check agent-iteration-card.js
          node --test agents/tests/routing.test.mjs
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('activity/repair-report.json'));if(!Array.isArray(x.repairCandidates)||!Array.isArray(x.unresolved))process.exit(1);console.log(x.applied,'safe local repairs recorded')"
      - name: Preserve scan receipts even when no code changed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moltnook-safe-link-repairs
          path: activity/repair-report.json
      - name: Publish actual HTML repairs only through robot review PR
        env:
          GH_TOKEN: ${{ secrets.GHP }}
        run: |
          if [ -z "$(git diff --name-only -- '*.html')" ]; then
            echo "No repaired site HTML; review receipt is archived only"
            exit 0
          fi
          test -n "$GH_TOKEN" || { echo "Missing scoped GitHub PR writer"; exit 1; }
          git config user.name "infinity-color-agents[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' activity/repair-report.json
          branch="robot/moltnook-links-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "Stage verified local HTML link repairs"
          sha="$(git rev-parse HEAD)"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch"             --title "Robot review: Moltnook verified link repair $GITHUB_RUN_ID"             --body "Exact local asset link corrections passed tests. HTML is security-sensitive and is **not eligible for unattended auto merge**.\n\nStaged source commit: $sha\nReview run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
