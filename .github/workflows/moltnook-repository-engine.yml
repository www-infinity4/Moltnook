name: Infinity cross-repository reader engineer and GPT Purple
# Owner-requested Brain execution check: 2026-10-21. Use existing signed owner engine; no public assist proxy.
on:
  push:
    branches: [main]
    paths: ['agents/repository-engine/**', '.github/workflows/moltnook-repository-engine.yml']
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: infinity-owner-repository-engine
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/bubbles-python-tools
      - name: Verify owner credential bridge
        run: node --test agents/repository-engine/credential-bridge.test.mjs agents/repository-engine/runner-oidc-bridge.test.mjs agents/repository-engine/auto-promote-reviewed.test.mjs
      - name: Connect existing owner GitHub key to Bubbles
        env:
          REPOSITORY_WRITE_TOKEN: ${{ secrets.GHP }}
        run: node agents/repository-engine/credential-bridge.mjs
      - name: Install isolated page renderer
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate immutable patch and path policy
        run: |
          node --test workers/bot-sandbox/worker.test.mjs agents/repository-engine/rollout-gate.test.mjs agents/repository-engine/evaluate-rollout.test.mjs agents/repository-engine/wallet-contract.test.mjs
          node --test agents/repository-engine/dependency-context.test.mjs
          node --check agents/repository-engine/runner.mjs
          node --check agents/repository-engine/source-verify.mjs
          node --test agents/repository-engine/source-verify.test.mjs
          node --check agents/repository-engine/preview.mjs
          node --check agents/repository-engine/patch.mjs
          node --check agents/repository-engine/repair-feedback.mjs
          node --check agents/repository-engine/runtime-baseline.mjs
          node --check agents/repository-engine/node-test-globals.mjs
          node --check agents/repository-engine/live-source.mjs
          node --check agents/repository-engine/source-evidence.mjs
          node --test agents/repository-engine/source-evidence.test.mjs
          node --test agents/repository-engine/pinned-review.test.mjs
          node --check agents/repository-engine/source-links.mjs
          node --test agents/repository-engine/source-links.test.mjs
          node --check agents/repository-engine/scoped-capabilities.mjs
          node --test agents/repository-engine/scoped-capabilities.test.mjs
          node --check agents/repository-engine/evidence-replan.mjs
          node --test agents/repository-engine/evidence-replan.test.mjs
          node --check agents/repository-engine/feature-manifest.mjs
          node --test agents/repository-engine/feature-manifest.test.mjs
          node --check agents/repository-engine/live-browser.mjs
          node --test agents/repository-engine/live-browser.test.mjs
          node --check agents/repository-engine/browser-observation-gate.mjs
          node --test agents/repository-engine/browser-observation-gate.test.mjs
          node --check agents/repository-engine/workflow-evidence.mjs
          node --test agents/repository-engine/workflow-evidence.test.mjs
          node --check agents/repository-engine/model-format-retry.mjs
          node --test agents/repository-engine/model-format-retry.test.mjs
          node --test agents/repository-engine/live-source.test.mjs agents/repository-engine/adapter-verification.test.mjs agents/repository-engine/execution-context.test.mjs
          node --test agents/repository-engine/patch.test.mjs agents/repository-engine/repair-feedback.test.mjs agents/repository-engine/runtime-baseline.test.mjs
          node --test agents/repository-engine/publish-reviewed.test.mjs agents/repository-engine/python-toolbox.test.mjs agents/repository-engine/auto-ticket-sweep.test.mjs
          node --test agents/repository-engine/python-language.test.mjs agents/repository-engine/fork-language-upstreams.test.mjs
          node --check agents/repository-engine/green-build-recovery.mjs
          node --test agents/repository-engine/green-build-recovery.test.mjs
          node --test agents/repository-engine/context-windows.test.mjs agents/repository-engine/runner-window-replan.test.mjs
          node --test agents/repository-engine/auto-promote-reviewed.test.mjs
          node --check agents/repository-engine/auto-promote-reviewed.mjs
          node --test agents/repository-engine/oracle-style-contract.test.mjs
          node --check agents/repository-engine/context-windows.mjs
      - name: Verify isolated sandbox and canary fixture contracts
        run: node agents/repository-engine/sandbox-verification.mjs
      - name: Verify live adapter reads and preserve unresolved capabilities
        env:
          REPOSITORY_WRITE_TOKEN: ${{ secrets.GHP }}
          WALLET_READ_TOKEN: ${{ secrets.WALLET_READ_TOKEN }}
        run: node agents/repository-engine/adapter-verification.mjs
      - name: Reader handoff, engineer implementation, Pink review and GPT Purple arbitration
        env:
          REPOSITORY_WRITE_TOKEN: ${{ secrets.GHP }}
        run: node agents/repository-engine/runner.mjs
      - name: Automatically promote owner robot PRs with verified target CI
        if: always()
        env:
          REPOSITORY_WRITE_TOKEN: ${{ secrets.GHP }}
        run: node agents/repository-engine/auto-promote-reviewed.mjs
      - name: Evaluate verified release promotion or rollback
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node agents/repository-engine/evaluate-rollout.mjs
      - name: Preserve actual work and exact blockers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infinity-repository-work-receipts
          path: repository-receipts/
